name: Feature request / 功能建议
description: Propose a user-centered improvement / 提出以用户问题为中心的改进建议
title: "[Feature] "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve / 要解决的问题
      description: What task is difficult or impossible today? / 当前哪项任务难以完成？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution / 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and tradeoffs / 替代方案与取舍
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy / 隐私
      options:
        - label: This request does not require sharing real clipboard contents, database files, keys, or credentials. / 此建议无需分享真实剪贴板内容、数据库、密钥或凭据。
          required: true
