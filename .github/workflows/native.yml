name: Native validation
on: [push, pull_request, workflow_dispatch]
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            pdfium: win-x64
          - os: macos-15
            target: aarch64-apple-darwin
            pdfium: mac-arm64
          - os: macos-15
            target: x86_64-apple-darwin
            pdfium: mac-x64
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            pdfium: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev cmake libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev libfontconfig1-dev libwayland-dev libvulkan-dev libasound2-dev libgtk-3-dev libayatana-appindicator3-dev libssl-dev
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --no-default-features --lib --target ${{ matrix.target }}
        if: matrix.target != 'x86_64-apple-darwin'
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - run: python scripts/fetch_pdfium.py --platform ${{ matrix.pdfium }} --output target/${{ matrix.target }}/release
      - uses: actions/upload-artifact@v4
        with:
          name: x-clipboard-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/x-clipboard*
            target/${{ matrix.target }}/release/*pdfium*
            target/${{ matrix.target }}/release/licenses
