.workspace-shell .manager-main{min-height:0}

function isQuick(){return ['quick','emoji','symbols','empty','no-results','missing-file','preview-error','permission','storage-error','loading','save-pending','paused'].includes(state.screen)||state.screen.startsWith('preview-');}
function statusStrip(){if(state.screen==='permission')return `<div class="alert-strip">${icon('shield')}目标窗口权限较高，内容已复制。<button data-action="explain-permission">查看帮助</button></div>`;if(state.screen==='storage-error')return `<div class="alert-strip error">${icon('alert')}保存失败，最新内容仍在重试队列中。<button data-action="retry-save">重试</button></div>`;if(state.screen==='save-pending')return `<div class="alert-strip">${icon('refresh')}正在保存最新记录，请稍候。</div>`;if(state.screen==='paused'||prefs.pause)return `<div class="alert-strip">${icon('pause')}已暂停记录，新复制的内容不会保存。<button data-action="resume">恢复记录</button></div>`;return '';}
function quick(){const picker=['emoji','symbols'].includes(state.screen);return `<div class="quick-workspace ${state.preview?'has-preview':''}"><section class="surface-window quick" aria-label="快捷面板">${titlebar('X Clipboard',true)}<div class="quick-head between"><span class="brandname">${picker?'随手表达':'剪贴板'}</span><div class="row gap8">${!picker?badge(`${icon(prefs.pause||state.screen==='paused'?'pause':'check')}${prefs.pause||state.screen==='paused'?'已暂停':'正在记录'}`,prefs.pause||state.screen==='paused'?'orange':'green'):''}${ib('grid','nav:manager','打开管理窗口')}</div></div><div class="quick-search">${searchBox(picker?'搜索表情或符号':'搜索你的剪贴板…')}</div>${picker?`<div class="tabs filter-tabs"><button class="tab" data-action="nav:quick">${icon('back')} 历史记录</button><span class="spacer"></span><button class="tab ${state.screen==='emoji'?'active':''}" data-action="nav:emoji">表情</button><button class="tab ${state.screen==='symbols'?'active':''}" data-action="nav:symbols">符号</button></div>`:searchTabs()}${statusStrip()}${picker?pickerHtml():`<div class="clip-list" id="clip-list">${listHtml()}</div>`}<div class="quick-foot"><span><kbd>↵</kbd> ${picker?'插入':'粘贴'}</span><span><kbd>Shift ↵</kbd> 纯文本</span><span><kbd>Esc</kbd> 关闭</span>${ib('settings','nav:general','设置')}</div>${overlays()}</section>${state.preview?`<section class="surface-window preview-panel" aria-label="侧边预览">${previewHtml(state.preview)}</section>`:''}</div>`;}
function previewHtml(id,inline=false){const r=records.find(x=>x.id===id)||initialRecords.find(x=>x.id===id)||initialRecords[2];return `<div class="preview-head">${!inline?`<button class="icon-btn back-preview" style="display:none" data-action="close-preview" aria-label="返回历史">${icon('back')}</button>`:''}<span class="type-icon ${r.kind}">${icon(r.kind)}</span><span>${kindLabel[r.kind]}预览</span><span class="spacer"></span>${!inline?ib('close','close-preview','关闭预览'):badge('本地内容')}</div><div class="preview-body">${previewContent(r)}</div><div class="preview-foot">${btn(inline?'复制内容':'粘贴到原窗口',`copy:${r.id}`,'primary',inline?'copy':'paste')}${['text','code','markdown','rich'].includes(r.kind)?btn('纯文本',`plain:${r.id}`,'','text'):btn('默认应用打开',`open:${r.id}`,'','external')}<span class="spacer"></span>${ib('star',`favorite:${r.id}`,r.favorite?'取消收藏':'收藏',`favorite ${r.favorite?'on':''}`)}</div>`;}
function previewContent(r){
 if(state.screen==='missing-file')return empty('file','原文件已不在这里','历史记录只保存文件引用。文件可能已移动、删除，或所在磁盘尚未连接。',btn('重新检查','recheck-file','','refresh'),true)+`<div class="preview-meta"><span>原始路径</span><span>${esc(r.path)}</span><span>记录内容</span><span>文件名称、路径和复制时间</span></div>`;
 if(state.screen==='preview-error')return empty('alert','暂时无法预览此文件','文件可能已损坏，或使用了暂不支持的 PDF 特性。你仍然可以复制文件引用或用默认应用打开。',btn('重新尝试','retry-preview','','refresh'),true);
 const top=`<h2 class="preview-title">${esc(r.title)}</h2><div class="preview-info"><span>${esc(r.source)}</span><span>·</span><span>${esc(r.time)}</span>${r.favorite?badge('已收藏','orange'):''}</div>`;
 let body='';
 if(r.kind==='image')body=`<div class="preview-canvas"><img src="sample-art.svg" style="width:${960*state.zoom/100}px;max-width:none;max-height:none;flex-shrink:0" alt="绿色山丘与暖色太阳的品牌视觉示例"></div><div class="zoom-bar">${ib('minus','zoom-out','缩小')}<span class="mono">${state.zoom}%</span>${ib('plus','zoom-in','放大')}<button data-action="zoom-fit">适应窗口</button><button data-action="zoom-actual">原始比例</button></div>`;
 else if(r.kind==='rich')body=`<div class="preview-text"><p><strong>让每一次复制，都有迹可循。</strong></p><p>一个安静、可靠的剪贴板，<br>让你专注手头的工作。</p><div class="quote">好的工具，应当在需要时出现，<br>在工作时退到身后。</div><p><strong>为你的工作流而设计</strong></p><ul><li>快速找回刚才复制的内容</li><li>收藏重要片段，置顶常用内容</li><li>文字、图片、文件，各得其所</li></ul></div>`;
 else if(r.kind==='code')body=`${badge('Rust','blue')}<pre class="code-block"><span class="comment">// 内容和格式共同决定是否重复</span>\n<span class="kw">fn</span> fingerprint(item: &ClipboardItem)\n    -> ContentHash\n{\n    <span class="kw">let mut</span> hash = Hasher::new();\n\n    <span class="kw">for</span> format <span class="kw">in</span> item.formats() {\n        hash.update(format.mime());\n        hash.update(format.bytes());\n    }\n\n    hash.finalize()\n}</pre><p class="small muted">保留原始缩进、换行和字符。</p>`;
 else if(r.kind==='markdown')body=`<div class="preview-text"><h2>设计交付说明</h2><p class="muted small">最后更新：2026 年 10 月 24 日</p><h3>交付内容</h3><ul><li>快捷面板与侧边预览</li><li>历史管理与收藏</li><li>浅色 / 深色主题</li></ul><h3>设计原则</h3><div class="quote">可发现、可操作、可撤销。</div><p>重要操作提供明确入口，异常状态给出下一步。</p></div>`;
 else if(r.kind==='pdf')body=`<div class="pdf-sheet"><div class="pdf-mark">STILL STUDIO / BRAND GUIDELINES</div><h2>${state.page===1?'少一点，刚刚好。':'让设计保持一致。'}</h2><p style="color:#6a7f74;margin-top:7px">${state.page===1?'2026 品牌设计规范':'02 / 色彩与使用规范'}</p><div style="margin-top:24px;color:#567565;line-height:1.9">${state.page===1?'清晰、从容、有所留白。<br>以自然的色彩与简洁的语言，<br>建立一种持久而舒适的视觉体验。':'主色用于关键操作与当前状态。<br>保留足够对比度，确保信息易于阅读。'}</div><div class="pdf-chart"><span style="height:38%"></span><span style="height:56%"></span><span style="height:70%"></span><span style="height:92%"></span></div><footer class="between"><span>STILL STUDIO · 2026</span><span>${String(state.page).padStart(2,'0')} / 12</span></footer></div><div class="zoom-bar">${ib('back','pdf-prev','上一页')}<span>第 ${state.page} 页 / 共 12 页</span>${ib('chevron','pdf-next','下一页')}${ib('minus','zoom-out','缩小')}<span>${state.zoom}%</span>${ib('plus','zoom-in','放大')}</div>`;
 else if(r.kind==='folder')body=`<div class="file-hero">${icon('folder')}<h3>秋季品牌项目</h3><p class="small muted mt8">文件夹 · 4 个直接子项</p></div>${[['folder','导出资源','文件夹'],['pdf','品牌设计规范 2026.pdf','2.4 MB'],['image','春日灵感.png','426 KB'],['markdown','项目说明.md','3 KB']].map(([i,t,s])=>`<div class="folder-row">${icon(i)}<span class="grow">${t}</span><span class="small muted">${s}</span></div>`).join('')}`;
 else if(r.kind==='file')body=`<div class="file-hero">${icon('file')}<h3>${r.title}</h3><p class="small muted mt8">Microsoft Word 文档 · 864 KB</p></div><div class="notice mt16">${icon('info')}<span>此格式暂不支持内置预览。可以使用默认应用查看，或将文件粘贴到目标位置。</span></div>`;
 else body=`<div class="preview-text">${esc(r.body||r.desc)}</div>`;
 const formats={text:'纯文本',rich:'HTML · RTF · 纯文本',image:'PNG · 位图',code:'纯文本',markdown:'纯文本',pdf:'文件引用',file:'文件引用',folder:'文件引用'};
 const meta=r.kind==='image'?'<div class="image-metadata"><span>960 × 640 px</span><span>PNG · 426 KB</span><span>保留原始图像</span></div>':`<div class="preview-meta"><span>${r.path?'文件路径':'内容格式'}</span><span>${esc(r.path||formats[r.kind])}</span><span>${r.path?'保存方式':'内容大小'}</span><span>${r.path?'仅引用原文件，不保存副本':r.bytes}</span></div>`;
 return top+body+meta;
}
function sidebar(settings=false){
 const active=id=>state.screen===id||(id==='manager'&&['search','multiselect','delete','clear','window-menu'].includes(state.screen))||(id==='pinned'&&state.screen==='pinned-empty')||(id==='favorites'&&state.screen==='favorites-empty')||(id==='storage'&&['key-unavailable','protected-capacity'].includes(state.screen))||(id==='shortcuts'&&state.screen==='shortcut-conflict');
 if(settings)return `<aside class="settings-sidebar"><div class="settings-label">${state.platform==='macos'?trafficControls():`${icon('settings')}<span>设置</span>`}</div>${[['general','通用设置','settings'],['appearance','外观设置','sun'],['shortcuts','快捷键','keyboard'],['storage','本地存储','disk'],['privacy','隐私保护','shield'],['sync','同步','cloud'],['about','关于','info']].map(([id,label,name])=>`<button class="nav-item ${active(id)?'active':''}" data-action="nav:${id}" title="${label}" aria-label="${label}">${icon(name)}<span>${label}</span></button>`).join('')}<div class="spacer"></div><div class="settings-bottom"><button class="nav-item" data-action="nav:manager" aria-label="返回剪贴板" title="返回剪贴板">${icon('back')}<span>返回剪贴板</span></button></div></aside>`;
 return `<aside class="app-rail"><div class="rail-brand" title="X Clipboard">${state.platform==='macos'?trafficControls():logo()}<strong>X Clipboard</strong></div><nav class="rail-nav" aria-label="主要导航"><div class="rail-label">剪贴板</div>${[['manager','全部历史','clipboard'],['pinned','置顶','pin'],['favorites','收藏','star'],['emoji','表情','smile'],['symbols','符号','symbol']].map(([id,label,name],i)=>`${i===3?'<div class="rail-divider"></div><div class="rail-label">快速输入</div>':''}<button class="rail-button ${active(id)?'active':''}" data-action="nav:${id}" aria-label="${label}" ${active(id)?'aria-current="page"':''}>${icon(name)}<span class="nav-text">${label}</span>${i<3?`<span class="nav-count">${records.filter(r=>id==='pinned'?r.pinned:id==='favorites'?r.favorite:true).length}</span>`:''}</button>`).join('')}</nav></aside>`;
}
function heading(title,description,actions=''){return `<div class="page-heading"><div><h1>${title}</h1><p>${description}</p></div>${actions}</div>`;}
function workspaceStatus(){return `<footer class="workspace-status"><div class="status-left-cell"><button class="rail-button" data-action="nav:general" aria-label="设置">${icon('settings')}<span class="nav-text">设置</span></button></div><div class="status-content"><div class="row"><span class="dot" style="${prefs.pause?'background:var(--warning)':''}"></span><span>${prefs.pause?'记录已暂停':'正在记录'}</span><button class="status-action" data-action="toggle:pause">${prefs.pause?'恢复':'暂停'}</button></div><span class="row status-middle">${icon('clipboard')}${state.query?`找到 ${filtered().length} 条结果`:`已保存 ${records.length} 条记录`}</span><span class="row status-right">${icon('lock')}本地加密 · ${platformShortcut()} 唤起</span></div></footer>`;}
function manager(){const titles={pinned:'置顶',favorites:'收藏','pinned-empty':'置顶','favorites-empty':'收藏',search:'搜索历史',multiselect:'全部历史'};const title=titles[state.screen]||'全部历史';const sub=state.screen.startsWith('pinned')?'常用内容固定在前，重复复制后更新顺序。':state.screen.startsWith('favorites')?'收藏的记录将保留，不参与自动清理。':'按最近复制排序，置顶记录始终在前。';return `<section class="surface-window manager workspace-shell"><div class="manager-main">${sidebar()}<section class="content">${titlebar('剪贴板',false,true)}${heading(title,sub,btn('打开快捷面板','nav:quick','','clipboard'))}<div class="content-toolbar">${searchBox('搜索内容、文件名称或来源…')}<span class="spacer"></span>${btn(state.multi?'完成':'多选','multi','','check')}${btn('清空历史','clear-dialog','','trash')}</div><div class="workspace-tabs" aria-label="内容类型">${[['all','全部内容'],['text','文本'],['image','图片'],['file','文件']].map(([id,l])=>`<button class="tab ${state.filter===id?'active':''}" data-action="filter:${id}">${l}</button>`).join('')}<span class="spacer"></span><span class="small muted">${state.query?'搜索结果':'最近复制'}</span></div>${state.multi?`<div class="selectionbar"><input type="checkbox" class="check" data-check-all aria-label="全选记录" ${state.chosen.size===filtered().length?'checked':''}><span>已选择 ${state.chosen.size} 项</span><span class="spacer"></span>${btn('收藏','batch-favorite','','star')}${btn('删除','batch-delete','danger','trash')}</div>`:''}<div class="history-body"><div class="history-list" id="clip-list">${listHtml()}</div><aside class="inline-preview">${filtered().length?previewHtml(state.selected,true):empty('clipboard','选择记录查看详情','内容预览与相关操作会显示在这里。')}</aside></div></section></div>${workspaceStatus()}${overlays()}</section>`;}
function toggle(key,label){return `<button class="toggle ${prefs[key]?'on':''}" role="switch" aria-checked="${!!prefs[key]}" aria-label="${label}" data-action="toggle:${key}"></button>`;}
function settingRow(label,description,control,extra=''){return `<div class="setting-row ${extra}"><div class="grow"><div class="label">${label}</div>${description?`<div class="description">${description}</div>`:''}</div>${control}</div>`;}
function section(title,content){return `<section class="settings-section"><h3>${title}</h3><div class="settings-card">${content}</div></section>`;}
function selectSetting(key,options){return `<select class="select" aria-label="${key==='position'?'面板位置':key==='density'?'显示密度':'设置选项'}" data-pref="${key}">${options.map(([v,l])=>`<option value="${v}" ${prefs[key]===v?'selected':''}>${l}</option>`).join('')}</select>`;}
function keys(str){return str.split('+').map(k=>`<kbd>${esc(k)}</kbd>`).join(' ');}
function platformShortcut(){return state.platform==='macos'?(prefs.macShortcut||'⌘+Shift+V'):state.platform==='linux'?(prefs.linuxShortcut||'Ctrl+Alt+V'):prefs.shortcut;}
function settings(){let screen=state.screen;if(['key-unavailable','protected-capacity'].includes(screen))screen='storage';if(screen==='shortcut-conflict')screen='shortcuts';const desc={general:'配置启动、窗口行为与记录状态。',appearance:'设置主题、显示密度与界面动效。',shortcuts:'配置全局唤起快捷键，查看面板内操作。',storage:'管理内容容量、保留规则与数据目录。',privacy:'管理加密保护与不需要记录的应用。',sync:'在你的设备之间，延续工作。',about:'为专注而设计，为日常而存在。'};return `<section class="surface-window manager settings-shell"><div class="manager-main">${sidebar(true)}<section class="content">${titlebar('设置')}${heading(settingNames[screen],desc[screen])}${screen==='sync'?syncContent():`<div class="settings-body">${settingsContent(screen)}</div>`}</section></div>${overlays()}</section>`;}
function settingsContent(screen){
 if(screen==='general')return section('启动与窗口',settingRow('登录时启动','在系统登录后自动开始记录。',toggle('startup','登录时启动'))+settingRow('关闭窗口后保留在托盘','后台继续记录，可通过快捷键随时唤起。',toggle('tray','关闭后保留托盘'))+settingRow('快捷面板位置','每次唤起时显示的位置。',selectSetting('position',[['cursor','鼠标所在位置'],['center','当前屏幕中央'],['last','上次位置']])) )+section('记录与反馈',settingRow('暂停记录','暂停期间不会保存新复制的内容。',toggle('pause','暂停记录'))+settingRow('显示保存失败提示','记录无法保存时给出可操作的提示。',toggle('notify','显示保存失败提示')))+`<div class="notice">${icon('keyboard')}<span>使用 ${keys(platformShortcut())} 唤起快捷面板。点击记录上的预览按钮，查看完整内容。</span></div>`;
 if(screen==='appearance')return `<section class="settings-section"><h3>主题</h3><div class="theme-grid">${[['light','浅色'],['dark','深色'],['system','跟随系统']].map(([v,l])=>`<button class="theme-option ${prefs.theme===v?'active':''}" data-action="theme:${v}"><div class="mini-window ${v}"><span></span><i></i></div><div class="between"><strong>${l}</strong>${prefs.theme===v?icon('check'):''}</div></button>`).join('')}</div></section>`+section('显示',settingRow('列表密度','调整历史记录之间的留白。',selectSetting('density',[['standard','舒适'],['compact','紧凑']]))+settingRow('界面语言','首版使用简体中文。','<span class="value">简体中文</span>')+settingRow('界面动效','关闭后使用即时过渡，系统减少动态效果优先。',toggle('motion','界面动效')))+`<div class="notice">${icon('monitor')}<span>窗口按钮与标题栏遵循当前系统习惯。界面会适配系统缩放比例与屏幕尺寸。</span></div>`;

 if(screen==='storage')return `${state.screen==='key-unavailable'?`<div class="notice error" style="margin-bottom:18px">${icon('lock')}<span><strong>暂时无法访问加密密钥</strong><br>请解锁系统密钥库后重试。不会创建新密钥或覆盖已有数据。</span>${btn('重试','retry-key')}</div>`:''}${state.screen==='protected-capacity'?`<div class="notice warning" style="margin-bottom:18px">${icon('shield')}<span><strong>置顶与收藏已超过容量上限</strong><br>受保护内容不会自动删除。请提高上限，或手动整理收藏。</span></div>`:''}`+section('内容占用',`<div class="usage-stats"><div><div class="number">${state.screen==='protected-capacity'?'2.3':'842'}<small>${state.screen==='protected-capacity'?'GB':'MB'} / ${prefs.capacity} GB</small></div><div class="caption">内容容量</div></div><div><div class="number">${records.length.toLocaleString()}<small>条</small></div><div class="caption">历史记录 / ${Number(prefs.rows).toLocaleString()} 条</div></div><div><div class="number">${state.screen==='protected-capacity'?'2.5 GB':'906 MB'}</div><div class="caption">实际磁盘占用</div></div></div><div class="usage-bar"><span></span><span></span><span></span></div><div class="usage-legend"><span>图片</span><span>文本与富文本</span><span>预览及其他</span></div>`)+section('保留规则',settingRow('最多保留记录数','超过上限时清理最旧的普通记录。',`<input type="number" min="1" step="100" data-pref="rows" aria-label="最多保留记录数" value="${prefs.rows}">`)+settingRow('内容容量上限','置顶与收藏不参与自动清理。',`<div class="row gap8"><input type="number" min="0.1" step="0.5" data-pref="capacity" aria-label="内容容量上限" value="${prefs.capacity}"><span class="small muted">GB</span></div>`))+section('本地数据',settingRow('数据目录',`<div class="path-value">${state.platform==='windows'?'C:\\Users\\Demo\\AppData\\Local\\X Clipboard':state.platform==='macos'?'~/Library/Application Support/X Clipboard':'~/.local/share/x-clipboard'}</div>`,btn('选择目录','choose-directory','','folder'))+settingRow('清空历史','默认保留置顶与收藏。',btn('清空…','clear-dialog','danger','trash')))+`<p class="small muted">文件只保存引用，原文件大小不计入内容容量。磁盘占用包含数据库维护空间。</p>`;

 if(focusId){const el=document.getElementById(focusId);if(el){el.focus({preventScroll:true});if(caret!==null&&caret!==undefined&&typeof el.setSelectionRange==='function'&&el.type!=='number')try{el.setSelectionRange(caret,caret)}catch{}}}
 const list=document.querySelector('#clip-list');if(list)list.scrollTop=listScroll;const sb=document.querySelector('.settings-body');if(sb)sb.scrollTop=settingScroll;
 document.getElementById('inspector').style.display=state.annotation?'block':'none';
 if(state.modal&&!document.activeElement?.closest('.modal'))document.querySelector('.modal [tabindex="0"],.modal input,.modal button')?.focus({preventScroll:true});
 if(!state.modal&&lastModal&&returnAction)document.querySelector(`[data-action="${returnAction}"]`)?.focus({preventScroll:true});
 lastModal=state.modal;
}
let toastTimer;
function notify(message){state.toast=message;state.menu=null;render();clearTimeout(toastTimer);toastTimer=setTimeout(()=>{state.toast='';render()},3400);}
function savePrefs(){try{localStorage.setItem('x-clipboard-design-preferences',JSON.stringify(prefs))}catch{}}
function navigate(screen){state.toast='';applyScreen(screen);if(!capture){const p=new URLSearchParams({screen,theme:state.theme,platform:state.platform});history.replaceState(null,'','?'+p.toString());}}
function action(name,e){const [a,...parts]=name.split(':');const v=parts.join(':');const r=records.find(x=>x.id===v);if(a!=='window-menu')state.windowMenu=false;switch(a){
 case'nav':state.emojiCategory='常用';navigate(v);break;
 case'filter':state.filter=v;if(settingNames[state.screen]||state.screen==='emoji')state.screen='manager';render();break;
 case'clear-search':state.query='';state.filter='all';render();document.getElementById('search-input')?.focus();break;
 case'preview':state.selected=v;state.zoom=r?.kind==='image'?imageFit():100;if(isQuick()){state.preview=state.preview===v?null:v;}render();break;
 case'close-preview':state.preview=null;if(state.screen.startsWith('preview-')||['missing-file','preview-error'].includes(state.screen))state.screen='quick';render();break;
 case'pin':if(r){r.pinned=!r.pinned;render();}break;
 case'favorite':if(r){r.favorite=!r.favorite;render();}break;
 case'copy':case'plain':if(r)notify(`原型演示：${isQuick()?'已回贴到原窗口':'已复制'}${a==='plain'?'（纯文本）':''}，未操作系统剪贴板。`);break;
 case'open':notify('原型演示：将用系统默认应用打开原文件。');break;
 case'more':{const window=e.target.closest('.surface-window');const rect=e.target.closest('button').getBoundingClientRect();const wr=window.getBoundingClientRect();state.menu={id:v,top:Math.min(rect.bottom-wr.top+4,wr.height-147),left:Math.max(6,Math.min(rect.right-wr.left-180,wr.width-192))};render();break;}
 case'duplicate':if(r){records=records.filter(x=>x.id!==v);r.time='刚刚';records.unshift(r);state.selected=v;state.menu=null;notify('已模拟再次复制：记录移至分区顶部，条数保持不变。');}break;
 case'delete':state.chosen=new Set([v]);state.modal='delete';state.menu=null;render();break;
 case'confirm-delete':{const ids=state.chosen.size?state.chosen:new Set([state.selected]);records=records.filter(x=>!ids.has(x.id));state.selected=records[0]?.id||'';state.chosen.clear();state.modal=null;state.screen=state.screen==='delete'?'manager':state.screen;notify('已删除示例记录，原始文件未受影响。');break;}
 case'clear-dialog':state.modal='clear';render();break;
 case'confirm-clear':{const include=document.getElementById('include-protected')?.checked;records=include?[]:records.filter(x=>x.pinned||x.favorite);state.selected=records[0]?.id||'';state.modal=null;if(state.screen==='clear')state.screen='manager';notify(include?'已清空全部示例记录。':'普通记录已清空，置顶与收藏已保留。');break;}
 case'close-modal':state.modal=null;state.recording=false;state.conflict=false;if(state.screen==='shortcut-conflict')state.screen='shortcuts';render();break;
 case'multi':state.multi=!state.multi;state.chosen.clear();render();break;
 case'batch-favorite':if(!state.chosen.size){notify('请先选择记录。');break;}records.forEach(x=>{if(state.chosen.has(x.id))x.favorite=true});notify(`已收藏 ${state.chosen.size} 条示例记录。`);break;
 case'batch-delete':if(!state.chosen.size){notify('请先选择记录。');break;}state.modal='delete';render();break;
 case'toggle':prefs[v]=!prefs[v];savePrefs();render();break;
 case'resume':prefs.pause=false;savePrefs();state.screen='quick';render();break;
 case'theme':prefs.theme=v;state.theme=v==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):v;savePrefs();render();break;
 case'toggle-theme':state.theme=state.theme==='dark'?'light':'dark';prefs.theme=state.theme;savePrefs();render();break;
 case'window-menu':state.windowMenu=!state.windowMenu;state.menu=null;render();break;
 case'record-shortcut':state.modal='shortcut';state.recorded='';state.conflict=false;state.recording=true;render();document.querySelector('.shortcut-recorder')?.focus();break;
 case'start-recording':state.recording=true;state.recorded='';state.conflict=false;render();document.querySelector('.shortcut-recorder')?.focus();break;
 case'save-shortcut':if(state.recorded&&!state.conflict){prefs[state.platform==='macos'?'macShortcut':state.platform==='linux'?'linuxShortcut':'shortcut']=state.recorded;savePrefs();state.modal=null;state.recording=false;notify('快捷键已保存在原型设置中，未注册系统快捷键。');}break;
 case'restore-shortcuts':prefs.shortcut='Win+V';delete prefs.macShortcut;delete prefs.linuxShortcut;savePrefs();notify('已恢复默认快捷键。');break;
 case'zoom-in':state.zoom=Math.min(200,state.zoom+25);render();updatePdfZoom();break;
 case'zoom-out':state.zoom=Math.max(25,state.zoom-25);render();updatePdfZoom();break;
 case'zoom-fit':state.zoom=imageFit();render();break;
 case'zoom-actual':state.zoom=100;render();break;
 case'pdf-prev':state.page=Math.max(1,state.page-1);render();break;
 case'pdf-next':state.page=Math.min(12,state.page+1);render();break;
 case'category':state.emojiCategory=v;render();break;
 case'insert':notify(`原型演示：已插入 ${v}，未操作系统剪贴板。`);break;
 case'recheck-file':notify('原型演示：仍未找到原文件，请检查原路径。');break;
 case'retry-preview':state.screen='preview-pdf';render();break;
 case'retry-save':state.screen='quick';notify('原型演示：重试成功，记录已保存。');break;
 case'retry-key':state.screen='storage';notify('原型演示：系统密钥库已解锁。');break;
 case'explain-permission':state.modal='help';render();break;
 case'choose-directory':notify('原生版将打开系统目录选择器；原型不改变磁盘数据。');break;
 case'system-permissions':notify('原生版将打开系统辅助功能设置；原型不更改权限。');break;
 case'add-exclusion':state.modal='exclusion';render();break;
 case'add-app':if(!prefs.excluded.includes(v))prefs.excluded.push(v);savePrefs();state.modal=null;render();break;
 case'remove-exclusion':prefs.excluded.splice(Number(v),1);savePrefs();render();break;
 case'licenses':case'help':state.modal=a;render();break;
 case'hide':state.hidden=true;state.modal=null;render();break;
 case'reopen':state.hidden=false;navigate('quick');break;
 case'maximize':notify('原生版将使用系统窗口缩放；此处保留设计尺寸。');break;
 case'exit':notify('原型演示：退出后停止后台记录，并释放快捷键。');break;
 case'annotate':state.annotation=!state.annotation;render();break;
 case'reset-demo':prefs=structuredClone(defaults);records=structuredClone(initialRecords);savePrefs();navigate('manager');break;
}}
function imageFit(){return Math.min(35,Math.floor(Math.max(220,innerWidth-120)/960*100));}
function updatePdfZoom(){const el=document.querySelector('.pdf-sheet');if(el)el.style.zoom=state.zoom/100;}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b){action(b.dataset.action,e);return;}if(e.target.matches('[data-check],[data-check-all]'))return;const row=e.target.closest('.clip');if(row){state.selected=row.dataset.id;state.zoom=records.find(r=>r.id===state.selected)?.kind==='image'?imageFit():100;state.menu=null;state.windowMenu=false;render();document.querySelector(`.clip[data-id="${state.selected}"]`)?.focus({preventScroll:true});return;}if(state.menu||state.windowMenu){state.menu=null;state.windowMenu=false;render();}});
document.addEventListener('dblclick',e=>{const row=e.target.closest('.clip');if(row&&!e.target.closest('button,input'))action('copy:'+row.dataset.id,e);});
document.addEventListener('input',e=>{if(e.target.id==='search-input'){state.query=e.target.value;render();}});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='screen-select'){navigate(t.value);return;}if(t.id==='platform-select'){state.platform=t.value;render();return;}if(t.id==='theme-select'){state.theme=t.value;render();return;}if(t.dataset.pref){const key=t.dataset.pref;let value=t.type==='checkbox'?t.checked:t.type==='number'?Number(t.value):t.value;if(t.type==='number'&&(!Number.isFinite(value)||value<=0)){t.value=prefs[key];notify('请输入大于 0 的有效数值。');return;}prefs[key]=value;savePrefs();render();return;}if(t.dataset.check){if(t.checked)state.chosen.add(t.dataset.check);else state.chosen.delete(t.dataset.check);render();return;}if(t.hasAttribute('data-check-all')){state.chosen=t.checked?new Set(filtered().map(x=>x.id)):new Set();render();return;}if(t.id==='include-protected'){const b=document.querySelector('[data-action="confirm-clear"]');b.textContent=t.checked?'清空全部记录':'清空普通记录';}});
document.addEventListener('keydown',e=>{
 if(state.modal==='shortcut'&&state.recording){if(e.key==='Escape'){e.preventDefault();state.modal=null;state.recording=false;render();return;}if(['Control','Alt','Shift','Meta'].includes(e.key))return;e.preventDefault();const modifiers=[];if(e.ctrlKey)modifiers.push('Ctrl');if(e.altKey)modifiers.push('Alt');if(e.shiftKey)modifiers.push('Shift');if(e.metaKey)modifiers.push(state.platform==='macos'?'⌘':'Win');state.recorded=[...modifiers,e.key.length===1?e.key.toUpperCase():e.key].join('+');state.conflict=!modifiers.some(x=>['Ctrl','Alt','Win','⌘'].includes(x))||['Ctrl+C','Ctrl+V','Ctrl+X','Ctrl+Z','Alt+F4','Ctrl+Alt+Delete','Win+L','⌘+C','⌘+V','⌘+Q'].includes(state.recorded);render();document.querySelector('.shortcut-recorder')?.focus();return;}
 if(e.key==='Escape'){e.preventDefault();if(state.modal){state.modal=null;state.recording=false;render();}else if(state.menu||state.windowMenu){state.menu=null;state.windowMenu=false;render();}else if(state.preview){state.preview=null;state.screen='quick';render();}else if(isQuick()){state.hidden=true;render();}return;}
 if(state.modal){if(e.key==='Tab'){const elements=[...document.querySelectorAll('.modal button:not(:disabled),.modal input,.modal [tabindex="0"]')];const first=elements[0],last=elements.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}return;}
 if(e.target.matches('input,select,textarea')||e.target.closest('#reviewbar'))return;
 if(e.key==='Enter'&&e.target.closest('.clip')){e.preventDefault();action((e.shiftKey?'plain:':'copy:')+state.selected,e);}
 else if(e.key===' '&&e.target.closest('.clip')){e.preventDefault();action('preview:'+state.selected,e);}
 else if(['ArrowDown','ArrowUp'].includes(e.key)&&e.target.closest('.clip')){e.preventDefault();const r=filtered();const current=r.findIndex(x=>x.id===state.selected);const next=Math.max(0,Math.min(r.length-1,current+(e.key==='ArrowDown'?1:-1)));state.selected=r[next].id;render();document.querySelector(`.clip[data-id="${state.selected}"]`)?.focus();}
});
document.addEventListener('mousemove',e=>{if(!state.annotation)return;const c=getComputedStyle(e.target);document.getElementById('inspector').textContent=`${e.target.tagName.toLowerCase()} · ${c.fontSize} / ${c.lineHeight} · padding ${c.padding} · ${c.color}`;});
window.design={screens,reset:()=>{records=structuredClone(initialRecords);prefs=structuredClone(defaults);savePrefs();applyScreen(state.screen)},snapshot:()=>({state:{...state,chosen:[...state.chosen]},records:structuredClone(records),prefs:structuredClone(prefs)}),navigate};
applyScreen(state.screen);
</script>
</body>
